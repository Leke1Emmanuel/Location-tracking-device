<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeTrace Hardware Relay Monitor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .controls {
            margin-bottom: 15px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .table-responsive {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #edf2f7;
        }
        th {
            background-color: #f8fafc;
            color: #4a5568;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .badge {
            background-color: #e2e8f0;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📡 Telemetry Log Feed (SIM800L Relay)</h2>
    <div class="controls">
        <button onclick="loadLogs()">🔄 Refresh Table Feed</button>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Server Timestamp</th>
                    <th>Device ID</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Speed (km/h)</th>
                    <th>Satellites</th>
                    <th>Battery (V)</th>
                    <th>SOS Signal</th>
                </tr>
            </thead>
            <tbody id="log-table-body">
                <tr>
                    <td colspan="8" class="no-data">Loading tracking feeds...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadLogs() {
        const tbody = document.getElementById('log-table-body');
        try {
            // Append cache buster parameter to guarantee live updates from server 
            const response = await fetch('logs.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error("No telemetry logging stream discovered yet.");
            
            const logs = await response.json();
            
            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="no-data">No logs available yet. Wait for SIM800L transmission.</td></tr>`;
                return;
            }
            
            tbody.innerHTML = ''; // Wipe loading notification
            logs.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.timestamp || 'N/A'}</strong></td>
                    <td><span class="badge">${item.deviceId || 'Unknown'}</span></td>
                    <td>${item.lat ?? '0.0000'}</td>
                    <td>${item.lon ?? '0.0000'}</td>
                    <td>${item.speed ?? '0'}</td>
                    <td>${item.sats ?? '0'}</td>
                    <td>${item.batt ? item.batt + 'V' : 'N/A'}</td>
                    <td>${item.sos ? item.sos : 'N/A' }</td>
                `;
                tbody.appendChild(row);
            });
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="8" class="no-data">⚠️ Error fetching logs: ${error.message}<br><small>This occurs if the SIM800L module hasn't sent data successfully yet.</small></td></tr>`;
        }
    }

    // Run table assembly immediately upon window entry
    loadLogs();
    // Poll updates silently every 30 seconds
    setInterval(loadLogs, 30000);
</script>

</body>
</html>
